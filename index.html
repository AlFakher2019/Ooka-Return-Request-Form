<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Request Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

    <form class="return-form" id="returnForm" method="POST"
        action="https://middlewares-a7edfgatcgaeh2ft.uaenorth-01.azurewebsites.net/api/ReturnRequest" novalidate>

        <!-- Contact Information -->
        <div class="section">
            <h3 class="section-title">Contact Information</h3>
            <div class="row">
                <div class="field">
                    <label for="firstName">First Name<span class="req">*</span></label>
                    <input type="text" id="firstName" name="FirstName" required>
                </div>
                <div class="field">
                    <label for="lastName">Last Name<span class="req">*</span></label>
                    <input type="text" id="lastName" name="LastName" required>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="PhoneNumber">
                </div>
                <div class="field">
                    <label for="email">Email<span class="req">*</span></label>
                    <input type="email" id="email" name="Email" required>
                </div>
            </div>
        </div>

        <!-- Order Information -->
        <div class="section">
            <h3 class="section-title">Order Information</h3>
            <div class="row half">
                <div class="field">
                    <label for="orderNumber">Order Number<span class="req">*</span></label>
                    <input type="text" id="orderNumber" name="OrderNumber" required>
                </div>
                <div class="spacer"></div>
            </div>
        </div>

        <!-- Products -->
        <div class="section" style="margin-bottom:0">
            <h3 class="section-title">Products</h3>

            <div id="productList">
                <div class="product-card" data-index="1">
                    <div class="product-head">
                        <div class="product-title"><span class="product-badge">!</span><span
                                class="product-label">Product 1</span></div>
                        <button type="button" class="remove-btn" aria-label="Remove product" title="Remove">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18" />
                                <path d="M8 6V4h8v2" />
                                <path d="M19 6l-1 14H6L5 6" />
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                            </svg>
                        </button>
                    </div>
                    <div class="row product-row">
                        <div class="field">
                            <label>Product name<span class="req">*</span></label>
                            <input type="text" name="ProductName_1" placeholder="Select an item" required>
                        </div>
                        <div class="field">
                            <label>Quantity</label>
                            <input type="number" name="Quantity_1" value="1" min="1">
                        </div>
                    </div>
                    <div class="row full">
                        <div class="field">
                            <label>Reason for Return<span class="req">*</span></label>
                            <div class="select-wrap">
                                <select name="Reason_1" required>
                                    <option value="" disabled selected>Select an option</option>
                                    <option>Wrong size</option>
                                    <option>Damaged / defective</option>
                                    <option>Wrong item received</option>
                                    <option>Not as described</option>
                                    <option>Changed my mind</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row full">
                        <div class="field">
                            <label>Description</label>
                            <textarea name="Description_1"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <button type="button" class="add-item" id="addItem"><span class="plus">+</span>Add another item</button>
        </div>

        <!-- Hidden Fields section (not visible to the customer) - set the values here -->
        <div class="section hidden-section" aria-hidden="true">
            <h3 class="section-title">Hidden Fields</h3>
            <div class="row full">
                <div class="field">
                    <label for="layout">Layout</label>
                    <input type="text" id="Shisha World B2C" name="Layout" value="#Shisha World B2C" readonly
                        tabindex="-1">
                </div>
            </div>
            <div class="row full">
                <div class="field">
                    <label for="source">Source</label>
                    <input type="text" id="OOKA Return Request Form" name="Source" value="#OOKA Return Request Form"
                        readonly tabindex="-1">
                </div>
            </div>
            <div class="row full">
                <div class="field">
                    <label for="leadFormLanguage">Lead Form Language</label>
                    <input type="text" id="English" name="English" value="#English" readonly tabindex="-1">
                </div>
            </div>
            <div class="row full">
                <div class="field">
                    <label for="status">Status</label>
                    <input type="text" id="Open" name="Status" value="#Open" readonly tabindex="-1">
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
        <div class="form-status" id="formStatus" role="status" aria-live="polite"></div>
    </form>

    <script>
        (function () {
            const list = document.getElementById('productList');
            const template = list.querySelector('.product-card').cloneNode(true);

            function renumber() {
                const cards = list.querySelectorAll('.product-card');
                list.classList.toggle('multiple', cards.length > 1);
                cards.forEach((card, i) => {
                    const n = i + 1;
                    card.dataset.index = n;
                    card.querySelector('.product-label').textContent = 'Product ' + n;
                    card.querySelectorAll('[name]').forEach(el => {
                        el.name = el.name.replace(/_\d+$/, '_' + n);
                    });
                });
            }

            // Remove any product (works for Product 1 too, once there are 2+)
            list.addEventListener('click', (e) => {
                const btn = e.target.closest('.remove-btn');
                if (!btn) return;
                if (list.querySelectorAll('.product-card').length <= 1) return;
                btn.closest('.product-card').remove();
                renumber();
            });

            document.getElementById('addItem').addEventListener('click', () => {
                const card = template.cloneNode(true);
                card.querySelectorAll('input, textarea').forEach(el => {
                    el.value = el.type === 'number' ? 1 : '';
                });
                card.querySelector('select').selectedIndex = 0;
                list.appendChild(card);
                renumber();
            });

            renumber();
        })();

        /* ============================================================
           AZURE FUNCTION SUBMISSION
           Put your Azure Function URL here (include ?code=... if the
           function uses a function key).
           ============================================================ */
        const AZURE_FUNCTION_URL = 'https://YOUR-FUNCTION-APP.azurewebsites.net/api/ReturnRequest?code=YOUR_FUNCTION_KEY';

        // Sent with every submission
        const FORM_BRAND = 'OOKA';
        const FORM_LANGUAGE = 'English';

        (function () {
            const form = document.getElementById('returnForm');
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('formStatus');

            function showStatus(type, msg) {
                statusBox.className = 'form-status ' + type;
                statusBox.textContent = msg;
            }

            function clearStatus() {
                statusBox.className = 'form-status';
                statusBox.textContent = '';
            }

            // Validate required fields and email format
            function validate() {
                let firstInvalid = null;
                form.querySelectorAll('input, select, textarea').forEach(el => {
                    const field = el.closest('.field');
                    if (!field) return;
                    let errorEl = field.querySelector('.error-text');
                    if (!errorEl) {
                        errorEl = document.createElement('div');
                        errorEl.className = 'error-text';
                        field.appendChild(errorEl);
                    }

                    let message = '';
                    const value = (el.value || '').trim();
                    if (el.required && !value) message = 'This field is required.';
                    else if (el.type === 'email' && value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) message = 'Please enter a valid email.';
                    else if (el.type === 'number' && value && Number(value) < 1) message = 'Must be at least 1.';

                    field.classList.toggle('invalid', !!message);
                    errorEl.textContent = message;
                    if (message && !firstInvalid) firstInvalid = el;
                });

                if (firstInvalid) {
                    firstInvalid.focus();
                    return false;
                }
                return true;
            }

            // Clear a field's error as soon as the user fixes it
            form.addEventListener('input', e => {
                const field = e.target.closest('.field');
                if (field) field.classList.remove('invalid');
            });
            form.addEventListener('change', e => {
                const field = e.target.closest('.field');
                if (field) field.classList.remove('invalid');
            });

            // Build the JSON payload sent to Azure
            function buildPayload() {
                const val = id => document.getElementById(id).value.trim();
                const products = [...document.querySelectorAll('#productList .product-card')].map((card, i) => ({
                    lineNumber: i + 1,
                    productName: card.querySelector('[name^="ProductName_"]').value.trim(),
                    quantity: parseInt(card.querySelector('[name^="Quantity_"]').value, 10) || 1,
                    reasonForReturn: card.querySelector('[name^="Reason_"]').value,
                    description: card.querySelector('[name^="Description_"]').value.trim()
                }));

                return {
                    submittedAt: new Date().toISOString(),
                    brand: FORM_BRAND,
                    language: FORM_LANGUAGE,
                    layout: val('layout'),
                    source: val('source'),
                    leadFormLanguage: val('leadFormLanguage'),
                    status: val('status'),
                    contact: {
                        firstName: val('firstName'),
                        lastName: val('lastName'),
                        phone: val('phone'),
                        email: val('email')
                    },
                    order: {
                        orderNumber: val('orderNumber')
                    },
                    products: products
                };
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearStatus();
                if (!validate()) return;

                const payload = buildPayload();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Submitting…';

                try {
                    const res = await fetch(AZURE_FUNCTION_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const text = await res.text().catch(() => '');
                        throw new Error('Server responded with ' + res.status + (text ? ': ' + text : ''));
                    }

                    showStatus('success', 'Thank you! Your return request has been submitted.');
                    form.reset();

                    // Reset to a single product
                    const cards = document.querySelectorAll('#productList .product-card');
                    cards.forEach((c, i) => { if (i > 0) c.remove(); });
                    document.getElementById('productList').classList.remove('multiple');
                } catch (err) {
                    console.error('Return form submission failed:', err);
                    showStatus('error', 'Sorry, something went wrong while submitting. Please try again.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Submit';
                }
            });
        })();
    </script>

</body>

</html>
